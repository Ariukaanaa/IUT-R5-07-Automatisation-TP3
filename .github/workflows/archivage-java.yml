name: Archivage Java
on: [push]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Création de rapport.txt
        run: date > rapport.txt

      - name: Archivage des .java
        run: |
          zip -r archive.zip $(find . -name "*.java" -not -path "./.git/*")

      # Verification
      - name: Vérification de l'intégrité de archive.zip
        run: |
          unzip -t archive.zip >> rapport.txt

      # Ajouter liste
      - name: Liste des fichiers dans rapport.txt
        run: |
          echo "" >> rapport.txt
          echo "=== Contenu de archive.zip ===" >> rapport.txt
          unzip -l archive.zip >> rapport.txt

      - name: Commit et push
        run: |
          git config --global user.name "Ariukaanaa"
          git config --global user.email "xxx+Ariukaanaa@users.noreply.github.com"
          git add rapport.txt archive.zip
          git commit -m "push archive.zip et rapport.txt [skip ci]"
          git push
