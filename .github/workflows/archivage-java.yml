name: Archivage Java daté
on: [push]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⬇️ ШИНЭ: Огноо авах
      - name: Définition de la date
        id: date
        run: echo "STAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # ⬇️ ШИНЭ: Огноотой архив
      - name: Archivage des .java
        run: |
          zip -r archive_${{ steps.date.outputs.STAMP }}.zip \
            $(find . -name "*.java" -not -path "./.git/*")

      # ⬇️ ШИНЭ: Огноотой тайлан
      - name: Vérification de l'intégrité
        run: |
          unzip -t archive_${{ steps.date.outputs.STAMP }}.zip \
            > rapport_${{ steps.date.outputs.STAMP }}.txt

      # ⬇️ ШИНЭ: Жагсаалт нэмэх
      - name: Liste des fichiers
        run: |
          echo "" >> rapport_${{ steps.date.outputs.STAMP }}.txt
          echo "=== Contenu de archive_${{ steps.date.outputs.STAMP }}.zip ===" \
            >> rapport_${{ steps.date.outputs.STAMP }}.txt
          unzip -l archive_${{ steps.date.outputs.STAMP }}.zip \
            >> rapport_${{ steps.date.outputs.STAMP }}.txt

      - name: Commit et push
        run: |
          git config --global user.name "Ariukaanaa"
          git config --global user.email "ariunbayar443@gmail.com"
          git add archive_*.zip rapport_*.txt
          git commit -m "Archive ${{ steps.date.outputs.STAMP }} [skip ci]"
          git push
